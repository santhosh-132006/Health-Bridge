# ===================================================================
# HealthBridge Smart Healthcare & Emergency Response Platform
# Main Configuration
# ===================================================================
spring.application.name=healthbridge-backend
server.port=${PORT:8080}

# Servlet & JSON
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=UTC

# Default development datasource: H2 with MySQL mode
# (Enables instant execution on any developer machine without requiring MySQL service running)
spring.datasource.url=jdbc:h2:mem:healthbridge_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static resource handling (Serves frontend directly from classpath:/static/)
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Gmail / SMTP Configuration for Verification Codes & Notifications
# (To use real Gmail, set your Gmail address and 16-character Google App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-google-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
