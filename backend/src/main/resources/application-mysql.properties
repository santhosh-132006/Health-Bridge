# ===================================================================
# HealthBridge - MySQL Production/Local Database Configuration
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or in application.properties: spring.profiles.active=mysql
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/healthbridge_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
